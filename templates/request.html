
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Blood</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background: url("/static/images/blood_bg.png") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
        }

        .page-overlay {
            background: rgba(255, 255, 255, 0.70);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 600;
            color: #17202a;
        }

        .request-card {
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            min-height: 158px;
            text-decoration: none;
            border-radius: 8px;
        }

        .request-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.20) !important;
        }

        .request-card h4 {
            font-size: 28px;
            font-weight: 600;
        }

        .request-card p {
            font-size: 19px;
            margin-bottom: 0;
        }

        @media (max-width: 767px) {
            .page-title {
                font-size: 28px;
            }

            .request-card {
                min-height: 135px;
            }

            .request-card h4 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="page-overlay">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-danger px-3">

        <span class="navbar-brand">
            Request Blood
        </span>

        <div>
            <a
                href="/dashboard"
                class="btn btn-light btn-sm me-2">
                Back
            </a>

            <a
                href="/logout"
                class="btn btn-dark btn-sm">
                Logout
            </a>
        </div>

    </nav>

    <!-- REQUEST TYPE SELECTION -->
    <div class="container mt-4 mt-md-5">

        <h2 class="page-title text-center mb-4">
            Choose Request Type
        </h2>

        <div class="row">

            <!-- EMERGENCY REQUEST -->
            <div class="col-md-6 mb-3">

                <a
                    href="/emergency"
                    class="card request-card p-4 shadow
                           bg-danger text-white
                           text-center justify-content-center">

                    <h4>
                        Emergency
                    </h4>

                    <p>
                        Immediate need
                    </p>

                </a>

            </div>

            <!-- REGULAR REQUEST -->
            <div class="col-md-6 mb-3">

                <a
                    href="/regular"
                    class="card request-card p-4 shadow
                           bg-primary text-white
                           text-center justify-content-center">

                    <h4>
                        Regular
                    </h4>

                    <p>
                        Planned request
                    </p>

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
